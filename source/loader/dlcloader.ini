; DLC loader settings (dinput8.dll). Delete this file to use the defaults shown.

[profile]
; Settings (settings.txt, controls.rmp) and saves go to <game>\<Dir>\ instead of the shared
; AppData\Local\Electronic Arts\Dead Space and Documents\Electronic Arts\Dead Space folders.
; Leave empty (Dir=) to use the shared folders.
Dir=profile

[dlc]
; 0 = don't inject any DLC (profile redirect and logging still run)
Enabled=1

[log]
; 1 = log every stream the game opens, not just DLC ones
AllStreams=0
; 1 = log CreateFileA/FindFirstFileA calls whose path mentions "dlc"
Files=1
